[project]
name = "civicvote-api"
version = "0.1.0"
description = "API FastAPI pour vote citoyen"
authors = [{name = "CivicVote", email = "tech@civicvote.local"}]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-jose[cryptography]>=3.3.0",
  "pydantic-settings>=2.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0"
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27", "ruff>=0.4"]

[tool.uvicorn]
factory = true
app = "app.main:create_app"
host = "0.0.0.0"
port = 8000
reload = true
